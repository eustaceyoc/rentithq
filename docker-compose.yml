services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: property
      POSTGRES_PASSWORD: property
      POSTGRES_DB: property_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property -d property_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - property_pg:/var/lib/postgresql/data

volumes:
  property_pg:
